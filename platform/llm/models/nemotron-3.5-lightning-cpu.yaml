# -ngl 0 keeps every layer on the CPU, so this runs on the llm-cpu gateway, even while 
# the GPU is reserved or held by another service. About 25GB of RAM, keep threads low 
# enough to leave room for your own work.
runtime: cpu
description: "CPU only: the same MoE with 3B active, entirely in system RAM"
ttl: 600
cmd: >-
  /app/llama-server --port 9999 -m /models/nemotron-3.5-lightning-30b-a3b-Q4_K_M.gguf -ngl 0 --threads 8 --ctx-size 32768 --ubatch-size 256 --flash-attn on --cache-type-k q8_0 --cache-type-v q8_0
