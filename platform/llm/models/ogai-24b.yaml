# GainEnergy OGAI-24B: oil and gas fine-tune of Mistral Small 24B Instruct 2501 (per the GGUF metadata), Q6_K.
# Dense, 40 layers: FFN of the first 16 on the CPU. A 0.5B Mistral Small draft (same Tekken tokenizer) speculates.
# The card publishes no eval or training data. Profile -long on the same file.
# https://huggingface.co/GainEnergy/OGAI-24B-Q6_K-GGUF
runtime: gpu
params: 24 # total, in billions
description: "Oil and gas: GainEnergy OGAI 24B (Mistral Small fine-tune), speculative decoding"
ttl: 600
cmd: >-
  /app/llama-server --port 9999 -m /models/ogai-24b-Q6_K.gguf -ngl 999 --override-tensor "blk\.([0-9]|1[0-5])\.ffn_.*=CPU" --ctx-size 16384 --ubatch-size 256 --flash-attn on --cache-type-k q8_0 --cache-type-v q8_0 --parallel 1 --spec-draft-model /models/draft-mistral-small-0.5b-Q8_0.gguf --spec-type draft-simple --spec-draft-ngl 999 --spec-draft-n-max 8 --spec-draft-n-min 1
