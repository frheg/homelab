# GainEnergy OGAI-24B: oil and gas fine-tune of Mistral Small 24B Instruct 2501 (per the GGUF metadata), Q6_K.
# Dense, 40 layers: FFN of the first 15 on the CPU. Measured 2026-11-18: with a 0.5B draft model 5.1 tok/s, the long
# profile without one 6.9 tok/s, so no draft: its VRAM goes to one more layer on the GPU.
# The card publishes no eval or training data. Profile -long on the same file.
# https://huggingface.co/GainEnergy/OGAI-24B-Q6_K-GGUF
runtime: gpu
params: 24 # total, in billions
description: "Oil and gas: GainEnergy OGAI 24B (Mistral Small fine-tune)"
ttl: 600
cmd: >-
  /app/llama-server --port 9999 -m /models/ogai-24b-Q6_K.gguf -ngl 999 --override-tensor "blk\.([0-9]|1[0-4])\.ffn_.*=CPU" --ctx-size 16384 --ubatch-size 256 --flash-attn on --cache-type-k q8_0 --cache-type-v q8_0 --parallel 1
