# Shared LLM gateways (llama-swap). One model is loaded at a time per gateway, others
# swap in on demand. Projects call a gateway and never run their own llama.
#   llm      GPU models (VRAM and RAM split). A gpuctl consumer, http://llm.llm
#   llm-cpu  CPU-only models. Always available, no GPU, http://llm-cpu.llm
# Models are one file each in models/, the two configs are generated: services/llmconf.
# It is a GPU consumer: gpuctl decides when it runs, so replicas is NOT set here.
apiVersion: v1
kind: Namespace
metadata:
  name: llm
  labels:
    gpu.kratos/access: "true" # gpuproxy calls the arbiter
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm
  namespace: llm
  labels: { gpu.kratos/consumer: llm }
spec:
  # replicas is owned by gpuctl, do not set it
  strategy: { type: Recreate } # never two pods on the GPU during a rollout
  selector: { matchLabels: { app: llm } }
  template:
    metadata:
      labels: { app: llm, gpu.kratos/consumer: llm }
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: llama-swap
          image: 100.117.102.56:5000/llama-swap@sha256:0b60f4e4fe74cc22008b97026701dd6651f17370e9ee4084c1e906565ac348c4 # upstream :cuda of 2026-08-24, mirrored
          args: ["-config", "/app/config.yaml", "-listen", ":8080"]
          env:
            - { name: HOME, value: /tmp }
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
          resources:
            requests: { cpu: "2", memory: 4Gi }
            limits: { memory: 24Gi, nvidia.com/gpu-0: "1" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /app/config.yaml, subPath: config.yaml, readOnly: true }
            - { name: models, mountPath: /models, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: llama-swap-gpu }
        - name: models
          hostPath: { path: /srv/models, type: Directory }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: llm-backend
  namespace: llm
spec:
  selector: { app: llm }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: llm
  namespace: llm
spec:
  selector: { app: gpuproxy-llm }
  ports: [{ port: 80, targetPort: 8080 }]
---
# Access control: nothing may call the gateway unless its namespace is labelled
#   llm.kratos/access=true     (kubectl label ns <project> llm.kratos/access=true)
# gpu-system is allowed for the proxy that wakes the gateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-llm-clients
  namespace: llm
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { llm.kratos/access: "true" } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: gpu-system } }
        - podSelector: {} # the proxy reaches the gateway inside this namespace
      ports: [{ port: 8080 }]
---
# CPU-only gateway. Not a gpuctl consumer: it has no GPU claim, so it keeps working
# while the GPU is reserved or used by another service. Models are in system RAM.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-cpu
  namespace: llm
spec:
  strategy: { type: Recreate }
  selector: { matchLabels: { app: llm-cpu } }
  template:
    metadata:
      labels: { app: llm-cpu }
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: llama-swap
          image: 100.117.102.56:5000/mirror/llama-swap@sha256:bb652785a2f5af4e238a2c35a0e965cda1c5d8a91755d7e3916381a73b0e660d # cpu 2026-10-29
          args: ["-config", "/app/config.yaml", "-listen", ":8080"]
          env:
            - { name: HOME, value: /tmp }
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
          resources:
            requests: { cpu: "2", memory: 2Gi }
            limits: { memory: 26Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /app/config.yaml, subPath: config.yaml, readOnly: true }
            - { name: models, mountPath: /models, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: llama-swap-cpu }
        - name: models
          hostPath: { path: /srv/models, type: Directory }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: llm-cpu
  namespace: llm
spec:
  selector: { app: llm-cpu }
  ports: [{ port: 80, targetPort: 8080 }]
---
# Front door of the llm GPU consumer: asks gpuctl for the GPU, then forwards. Clients keep
# calling the Service "llm", which now points here, and the real one is "llm-backend".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpuproxy-llm
  labels: { gpu.kratos/proxy: llm }
  namespace: llm
spec:
  selector: { matchLabels: { app: gpuproxy-llm } }
  template:
    metadata:
      labels: { app: gpuproxy-llm }
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: gpuproxy
          image: 100.117.102.56:5000/gpuproxy@sha256:1c555c77bf2cc81539ee732534012571e6a30da726b323ec62cc9a8f26a8a83e
          args: ["-consumer", "llm", "-backend", "http://llm-backend.llm", "-gpuctl", "http://gpuctl.gpu-system"]
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /_gpuproxy/healthz, port: 8080 }
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
