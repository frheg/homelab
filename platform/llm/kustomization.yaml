apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - llm.yaml
# generated by services/llmconf from models/*.yaml; a change rolls the gateway
configMapGenerator:
  - name: llama-swap-gpu
    namespace: llm
    files:
      - config.yaml=config-gpu.yaml
  - name: llama-swap-cpu
    namespace: llm
    files:
      - config.yaml=config-cpu.yaml
