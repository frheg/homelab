groups:
  - name: kubernetes
    rules:
      - alert: NodeNotReady
        expr: kube_node_status_condition{condition="Ready", status="true"} == 0
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "Node {{ $labels.node }} is not Ready", description: "Kubernetes reports the node as not Ready." }
      - alert: PodCrashLooping
        expr: kube_pod_container_status_restarts_total - (kube_pod_container_status_restarts_total offset 30m) > 3
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.namespace }}/{{ $labels.pod }} keeps restarting", description: "Container {{ $labels.container }} restarted {{ $value }} times in 30 minutes." }
      - alert: ContainerOOMKilled
        expr: (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1) and on (namespace, pod, container) (kube_pod_container_status_restarts_total - (kube_pod_container_status_restarts_total offset 15m) > 0)
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.namespace }}/{{ $labels.pod }} was OOM killed", description: "Container {{ $labels.container }} hit its memory limit." }
      # All pods share one kernel limit (allocatable). At the limit the kernel kills across pods.
      - alert: PodMemoryNearLimit
        expr: container_memory_working_set_bytes{id="/kubepods.slice"} / on () group_left () sum(kube_node_status_allocatable{resource="memory"}) > 0.9
        for: 2m
        labels: { severity: warning }
        annotations: { summary: "Pods use over 90% of the pod memory limit", description: "{{ $value | humanizePercentage }} used. At 100% the kernel kills processes in any pod." }
      # GPU consumers are scaled to 0 by gpuctl, so only Deployments that want pods count.
      # 30 minutes covers the slowest start (strata, 25 minutes).
      - alert: DeploymentUnavailable
        expr: kube_deployment_spec_replicas > 0 and kube_deployment_status_replicas_available < kube_deployment_spec_replicas
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.namespace }}/{{ $labels.deployment }} is not available", description: "Fewer replicas ready than wanted for 30 minutes." }
      - alert: DaemonSetUnavailable
        expr: kube_daemonset_status_number_unavailable > 0
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.namespace }}/{{ $labels.daemonset }} has unavailable pods", description: "{{ $value }} pods not ready for 15 minutes." }
      - alert: ClaimPending
        expr: kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Claim {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is Pending", description: "No volume was bound in 15 minutes." }
      - alert: FluxNotReady
        expr: gotk_reconcile_condition{type="Ready", status="False"} == 1
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Flux {{ $labels.kind }} {{ $labels.name }} is not Ready", description: "Check: flux get all -A" }
