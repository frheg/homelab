# Same basic-auth as the other UIs (middleware lives in platform-ui).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: platform-ui-basic-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /grafana
            pathType: Prefix
            backend: { service: { name: grafana, port: { number: 3000 } } }
---
# Query APIs: this namespace and the ones labelled monitoring.kratos/access=true.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-monitoring-clients, namespace: monitoring }
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [victoria, vmalert, alertmanager, kube-state-metrics] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector: { matchLabels: { monitoring.kratos/access: "true" } }
---
# Grafana is for Traefik (after the basic-auth) and for VictoriaMetrics scraping its metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-grafana-clients, namespace: monitoring }
spec:
  podSelector: { matchLabels: { app: grafana } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
        - podSelector: { matchLabels: { app: victoria } }
      ports: [{ port: 3000 }]
