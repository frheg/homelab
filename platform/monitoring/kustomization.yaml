apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - victoria.yaml
  - kube-state-metrics.yaml
  - alerting.yaml
  - ntfy.yaml
  - ntfy.sops.yaml
  - grafana.yaml
  - ingress.yaml
# A changed file gets a new ConfigMap name (hash), so the pods using it roll.
configMapGenerator:
  - { name: vm-scrape, namespace: monitoring, files: [scrape.yaml] }
  - { name: alertmanager-config, namespace: monitoring, files: [alertmanager.yaml] }
  - { name: vmalert-rules-node, namespace: monitoring, files: [rules/node.yaml] }
  - { name: vmalert-rules-gpu, namespace: monitoring, files: [rules/gpu.yaml] }
  - { name: vmalert-rules-kubernetes, namespace: monitoring, files: [rules/kubernetes.yaml] }
  - { name: vmalert-rules-backup, namespace: monitoring, files: [rules/backup.yaml] }
  - { name: vmalert-rules-meta, namespace: monitoring, files: [rules/meta.yaml] }
  - { name: grafana-datasources, namespace: monitoring, files: [grafana/datasources.yaml] }
  - { name: grafana-dashboard-provider, namespace: monitoring, files: [grafana/dashboards.yaml] }
  - { name: grafana-dash-node, namespace: monitoring, files: [dashboards/node-exporter-full.json] }
  - { name: grafana-dash-gpu, namespace: monitoring, files: [dashboards/nvidia-gpu.json] }
  - { name: grafana-dash-pods, namespace: monitoring, files: [dashboards/kubernetes-pods.json] }
