# Advertises the host's CDI devices (nvidia.com/gpu=...) to kubelet so pods can
# request them. The spec is generated on the host by
# nvidia-container-toolkit-cdi-generator.service (NixOS). Only runs on nodes
# labelled nixos-nvidia-cdi=enabled (set in modules/k3s.nix).
apiVersion: v1
kind: Namespace
metadata:
  name: generic-cdi-plugin
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: generic-cdi-plugin
  namespace: generic-cdi-plugin
spec:
  selector:
    matchLabels:
      name: generic-cdi-plugin
  template:
    metadata:
      labels:
        name: generic-cdi-plugin
    spec:
      nodeSelector:
        nixos-nvidia-cdi: enabled
      containers:
        - name: generic-cdi-plugin
          image: ghcr.io/olfillasodikno/generic-cdi-plugin@sha256:5399b02c75e7e1ef2f9f4d2ab75e05cfa66fac6e30bd2a8ea1045f8c02bda4ec # was :main
          command:
            - /generic-cdi-plugin
            - /var/run/cdi/nvidia-container-toolkit.json
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            privileged: true
          volumeMounts:
            - name: kubelet
              mountPath: /var/lib/kubelet
            - name: cdi
              mountPath: /var/run/cdi
              readOnly: true
      volumes:
        - name: kubelet
          hostPath:
            path: /var/lib/kubelet
        - name: cdi
          hostPath:
            path: /var/run/cdi
