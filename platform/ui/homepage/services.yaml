# Every UI on kratos. Numbers come from VictoriaMetrics (platform-ui has monitoring.kratos/access).
# Each tile shows whether its pods run (namespace and podSelector, read through the homepage service account).
# A service that is off keeps its tile and link; the page answers once the service is started.
# llm-confidential has no UI link on purpose: it serves confidential prompts.
- Athena:
    - Athena:
        href: /athena/
        description: Personal assistant. Chat, approvals, memory, jobs
        namespace: athena
        podSelector: app=core
        widget:
          type: prometheusmetric
          url: http://victoria.monitoring:8428
          refreshInterval: 30000
          metrics:
            - label: Pods ready
              query: sum(kube_pod_status_ready{namespace="athena",condition="true"}) or vector(0)
            - label: Restarts, 1 h
              query: sum(kube_pod_container_status_restarts_total{namespace="athena"} - (kube_pod_container_status_restarts_total{namespace="athena"} offset 1h)) or vector(0)
- Services:
    - llama.cpp:
        href: http://kratos:8401/ui/
        description: The model gateway (llama-swap). Models, activity, logs. Opening it does not take the GPU
        namespace: llm
        podSelector: app=llm
        showStats: true
    - Qdrant:
        href: http://kratos:8402/dashboard
        description: Vector database. Collections, points, search
        namespace: qdrant
        podSelector: app=qdrant
        showStats: true
    - Neo4j:
        href: http://kratos:8403/browser/
        description: Graph database. Connect to neo4j://kratos:7687 with the Neo4j login
        namespace: neo4j
        podSelector: app=neo4j
        showStats: true
    - Postgres:
        href: http://kratos:8405/
        description: pgweb, read-only. Host postgres.postgres, port 5432, a database role
        namespace: postgres
        podSelector: app=postgres
        showStats: true
    - SearXNG:
        href: http://kratos:8404/
        description: Web search used by Athena and others
        namespace: searxng
        podSelector: app=searxng
        showStats: true
    - VictoriaMetrics:
        href: http://kratos:8406/vmui/
        description: Metrics store. Query anything (PromQL)
        namespace: monitoring
        podSelector: app=victoria
        showStats: true
    - Alertmanager:
        href: http://kratos:8407/
        description: Firing alerts and silences
        namespace: monitoring
        podSelector: app=alertmanager
    - Camera:
        href: http://kratos:8410/
        description: The webcam on kratos, live (camview-web, tailnet only)
- Monitoring:
    - Overview:
        href: /grafana/
        description: One screen, is kratos OK? (Grafana)
        widget:
          type: prometheusmetric
          url: http://victoria.monitoring:8428
          refreshInterval: 30000
          metrics:
            - label: Alerts firing
              query: count(ALERTS{alertstate="firing"}) or vector(0)
            - label: Restarts, 1 h
              query: sum(kube_pod_container_status_restarts_total - (kube_pod_container_status_restarts_total offset 1h)) or vector(0)
            - label: Pod memory
              query: sum(container_memory_working_set_bytes{container!="",pod!=""})
              format: { type: bytes }
            - label: Disk free
              query: node_filesystem_avail_bytes{mountpoint="/"}
              format: { type: bytes }
    - Host:
        href: /grafana/d/rYdddlPWk
        description: CPU, memory, disk, network, systemd (Node Exporter Full)
    - Pods:
        href: /grafana/d/k8s_views_pods
        description: CPU, memory and restarts per pod
    - Alerts on the phone:
        href: http://kratos:2586/kratos-alerts
        description: ntfy topic kratos-alerts (log in as v1s)
- GPU:
    - Panel:
        href: /panel/
        description: GPU and profile buttons
        widget:
          type: customapi
          url: http://panel.platform-ui/api/state
          refreshInterval: 10000
          mappings:
            - field: gpu.holder
              label: GPU holder
            - field: gpu.reserved_by
              label: Reserved by
            - field: alerts_firing
              label: Alerts firing
    - GPU card:
        href: /grafana/d/vlvPlrgnk
        description: Load, VRAM, temperature, power (Grafana)
        widget:
          type: prometheusmetric
          url: http://victoria.monitoring:8428
          refreshInterval: 15000
          metrics:
            - label: Load
              query: nvidia_smi_utilization_gpu_ratio * 100
              format: { type: percent }
            - label: VRAM
              query: nvidia_smi_memory_used_bytes / nvidia_smi_memory_total_bytes * 100
              format: { type: percent }
            - label: Temperature
              query: nvidia_smi_temperature_gpu
              format: { type: number, suffix: " °C" }
- Thesis:
    - Makeup Search:
        href: /makeup/
        description: Real Odfjell data. Confidential, assistant through llm-confidential
    - Makeup Search demo:
        href: /makeup-demo/
        description: Synthetic data, safe to show
- Cluster:
    - Headlamp:
        href: /headlamp/
        description: Kubernetes UI (token login)
