# Cluster UI. Served under /headlamp behind the Traefik basic-auth middleware;
# Headlamp itself additionally asks for a service-account token (headlamp-rbac.yaml).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: headlamp
  namespace: platform-ui
spec:
  interval: 1h
  url: https://kubernetes-sigs.github.io/headlamp/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: platform-ui
spec:
  interval: 1h
  chart:
    spec:
      chart: headlamp
      version: 0.46.0
      sourceRef:
        kind: HelmRepository
        name: headlamp
  values:
    config:
      baseURL: /headlamp
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 256Mi }
