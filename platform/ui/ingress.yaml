# Everything is reachable only on the tailnet (the host firewall trusts only
# tailscale0). Basic-auth is the first gate; secret in basic-auth.sops.yaml.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: basic-auth, namespace: platform-ui }
spec:
  basicAuth:
    secret: basic-auth-users
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-ui
  namespace: platform-ui
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: platform-ui-basic-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /headlamp
            pathType: Prefix
            backend: { service: { name: headlamp, port: { number: 80 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: homepage, port: { number: 80 } } }
---
# /home is the start page too.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: home-redirect, namespace: platform-ui }
spec:
  redirectRegex:
    regex: ^(https?://[^/]+)/home/?$
    replacement: ${1}/
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home
  namespace: platform-ui
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: platform-ui-basic-auth@kubernetescrd,platform-ui-home-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /home
            pathType: Prefix
            backend: { service: { name: homepage, port: { number: 80 } } }
