# Two logins for Headlamp. Default to the read-only one; use the admin token
# only when changing things by hand. Read a token with:
#   kubectl -n platform-ui get secret headlamp-viewer-token -o jsonpath='{.data.token}' | base64 -d
apiVersion: v1
kind: ServiceAccount
metadata: { name: headlamp-viewer, namespace: platform-ui }
---
apiVersion: v1
kind: Secret
metadata:
  name: headlamp-viewer-token
  namespace: platform-ui
  annotations: { kubernetes.io/service-account.name: headlamp-viewer }
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: headlamp-viewer }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view }
subjects:
  - { kind: ServiceAccount, name: headlamp-viewer, namespace: platform-ui }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: headlamp-admin, namespace: platform-ui }
---
apiVersion: v1
kind: Secret
metadata:
  name: headlamp-admin-token
  namespace: platform-ui
  annotations: { kubernetes.io/service-account.name: headlamp-admin }
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: headlamp-admin }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-admin }
subjects:
  - { kind: ServiceAccount, name: headlamp-admin, namespace: platform-ui }
