# Buttons for the GPU and the profiles at /panel/, see services/panel. Stateless: it
# calls gpuctl and the Kubernetes API. Behind the same basic-auth as the rest of the UI.
apiVersion: v1
kind: ServiceAccount
metadata: { name: panel, namespace: platform-ui }
---
# Same reach as profctl: list namespaces, scale workloads. Nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: panel }
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: panel }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: panel }
subjects:
  - { kind: ServiceAccount, name: panel, namespace: platform-ui }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: panel, namespace: platform-ui }
spec:
  replicas: 1
  selector: { matchLabels: { app: panel } }
  template:
    metadata: { labels: { app: panel } }
    spec:
      serviceAccountName: panel
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: panel
          image: 100.117.102.56:5000/panel@sha256:0613c772c4a8972e1c2510433db91054f109ba03f3d80db6367ae8370667e0fd
          args:
            - -gpuctl=http://gpuctl.gpu-system
            - -victoria=http://victoria.monitoring:8428
            - -alertmanager=http://alertmanager.monitoring:9093
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /, port: 8080 }
          resources:
            requests: { cpu: 5m, memory: 24Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata: { name: panel, namespace: platform-ui }
spec:
  selector: { app: panel }
  ports: [{ port: 80, targetPort: 8080 }]
---
# The panel has no login of its own: only Traefik (after basic-auth) and the
# Homepage widget may reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-panel-clients, namespace: platform-ui }
spec:
  podSelector: { matchLabels: { app: panel } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
        - podSelector: { matchLabels: { app: homepage } }
      ports: [{ port: 8080 }]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: strip-panel, namespace: platform-ui }
spec:
  stripPrefix:
    prefixes: [/panel]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: panel
  namespace: platform-ui
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: platform-ui-basic-auth@kubernetescrd,platform-ui-strip-panel@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /panel
            pathType: Prefix
            backend: { service: { name: panel, port: { number: 80 } } }
