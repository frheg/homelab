apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - basic-auth.sops.yaml
  - headlamp.yaml
  - headlamp-rbac.yaml
  - homepage.yaml
  - panel.yaml
  - ingress.yaml
configMapGenerator:
