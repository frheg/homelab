# Attachments: what you add to a chat, with the text read out of it and image previews. Up to 20 MB a file, 2 GB in all.
apiVersion: apps/v1
kind: Deployment
metadata: { name: files, namespace: athena }
spec:
  replicas: 1
  selector: { matchLabels: { app: files } }
  template:
    metadata:
      labels: { app: files, athena/egress: postgres }
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532 }
      containers:
        - name: files
          image: kratos:5000/athena-files@sha256:78c97c09bf14151f0a40893dff843c8c7c0f689de62819aceb042421dff4481f # 0.6.1
          env:
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: athena, key: FILES_DATABASE_URL } } }
            - { name: MCP_TOKENS, valueFrom: { secretKeyRef: { name: athena, key: MCP_TOKENS_FILES } } }
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /ready, port: 8080 } }
          # decoding a large photo for its preview takes a few hundred MB for a moment
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 768Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
# Answers read aloud on the CPU: Kokoro (English) and Piper (Norwegian); and speech to text for live mode in the
# browser (whisper.cpp, Whisper small). No network but core.
apiVersion: apps/v1
kind: Deployment
metadata: { name: speech, namespace: athena }
spec:
  replicas: 1
  selector: { matchLabels: { app: speech } }
  template:
    metadata:
      labels: { app: speech }
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532 }
      containers:
        - name: speech
          image: kratos:5000/athena-speech@sha256:a3b86df68b2947c287d9a599dc3bd8e98c4ac78f738ef04e9a6d266e7ee5ed8f # 0.6.1
          env:
            - { name: TOKENS, valueFrom: { secretKeyRef: { name: athena, key: SPEECH_TOKENS } } }
            - { name: WHISPER_THREADS, value: "8" } # a few seconds of speech in about 1.5 s
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /ready, port: 8080 } }
          resources: { requests: { cpu: 20m, memory: 128Mi }, limits: { memory: 3Gi } } # Kokoro about 0.6 GB, Whisper small about 0.5 GB
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
# The camera in live mode: pose, hands and gestures in small pictures the browser sends through core (MediaPipe on the
# CPU, about 30 ms a picture). Nothing is kept. No network but core.
apiVersion: apps/v1
kind: Deployment
metadata: { name: pose, namespace: athena }
spec:
  replicas: 1
  selector: { matchLabels: { app: pose } }
  template:
    metadata:
      labels: { app: pose }
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532 }
      containers:
        - name: pose
          image: kratos:5000/athena-pose@sha256:963a6f0621a0178041785fdc97b687492891e9d5b1ea9df201b0120ee8b2670e # 0.6.1
          env:
            - { name: TOKENS, valueFrom: { secretKeyRef: { name: athena, key: POSE_TOKENS } } }
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /ready, port: 8080 } }
          resources: { requests: { cpu: 20m, memory: 128Mi }, limits: { memory: 768Mi } } # about 170 MB in use
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
---
# ---------- cluster servers ----------
# Read: get and list on pods, logs, deployments, events in the namespaces bound below, and nodes. Confidential
# namespaces (makeup, llm-confidential, thesis-*) are not bound, so their pods and logs stay unreadable.
apiVersion: v1
kind: ServiceAccount
metadata: { name: mcp-cluster-read, namespace: athena }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: athena-cluster-read }
rules:
  - { apiGroups: [""], resources: [pods, pods/log, events], verbs: [get, list] }
  - { apiGroups: [apps], resources: [deployments], verbs: [get, list] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: athena-cluster-nodes }
rules:
  - { apiGroups: [""], resources: [nodes], verbs: [get, list] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: athena-cluster-nodes }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: athena-cluster-nodes }
subjects: [{ kind: ServiceAccount, name: mcp-cluster-read, namespace: athena }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: athena-cluster-read, namespace: athena }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: athena-cluster-read }
subjects: [{ kind: ServiceAccount, name: mcp-cluster-read, namespace: athena }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: athena-cluster-read, namespace: llm }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: athena-cluster-read }
subjects: [{ kind: ServiceAccount, name: mcp-cluster-read, namespace: athena }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: athena-cluster-read, namespace: homelab }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: athena-cluster-read }
subjects: [{ kind: ServiceAccount, name: mcp-cluster-read, namespace: athena }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: athena-cluster-read, namespace: makeup-demo }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: athena-cluster-read }
subjects: [{ kind: ServiceAccount, name: mcp-cluster-read, namespace: athena }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: athena-cluster-read, namespace: searxng }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: athena-cluster-read }
subjects: [{ kind: ServiceAccount, name: mcp-cluster-read, namespace: athena }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: athena-cluster-read, namespace: monitoring }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: athena-cluster-read }
subjects: [{ kind: ServiceAccount, name: mcp-cluster-read, namespace: athena }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: athena-cluster-read, namespace: gpu-system }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: athena-cluster-read }
subjects: [{ kind: ServiceAccount, name: mcp-cluster-read, namespace: athena }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: athena-cluster-read, namespace: flux-system }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: athena-cluster-read }
subjects: [{ kind: ServiceAccount, name: mcp-cluster-read, namespace: athena }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mcp-cluster-read, namespace: athena }
spec:
  replicas: 1
  selector: { matchLabels: { app: mcp-cluster-read } }
  template:
    metadata:
      labels: { app: mcp-cluster-read, athena/egress: cluster }
    spec:
      serviceAccountName: mcp-cluster-read
      enableServiceLinks: false
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532 }
      containers:
        - name: mcp-cluster-read
          image: kratos:5000/athena-mcp-cluster-read@sha256:15c3e749bebc7f0efcabb4e47af6110ad35dd08d57d0fa98b7924fddc27909ee # 0.6.1
          env:
            - { name: NAMESPACES, value: "athena,llm,homelab,makeup-demo,searxng,monitoring,gpu-system,flux-system" }
            - { name: GPUCTL_URL, value: "http://gpuctl.gpu-system" }
            - { name: METRICS_URL, value: "http://victoria.monitoring:8428" }
            - { name: MCP_TOKENS, valueFrom: { secretKeyRef: { name: athena, key: MCP_TOKENS_CLUSTER } } }
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /ready, port: 8080 } }
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 256Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
# Act: list and delete pods in the namespaces of the restart targets in cluster-actions.yaml, nothing else.
apiVersion: v1
