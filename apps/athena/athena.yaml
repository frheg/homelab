# Athena (github.com/frheg/athena): the personal assistant. Same images as the Docker version, configured by
# environment only. On kratos it uses the platform's Postgres, SearXNG, llm gateways, gpuctl and VictoriaMetrics.
#   http://kratos/athena/   behind the platform basic-auth; Traefik is the gate, so core runs without API_TOKEN
# Images are published with athena's scripts/publish. Policy and cluster actions: policy.yaml, cluster-actions.yaml.
# Memory embeds with bge-m3 on llm-cpu and keeps vectors in Qdrant (falls back to word search when either is down).
# Each pod may reach DNS and exactly what it needs (NetworkPolicies at the end).
apiVersion: v1
kind: Namespace
metadata:
  name: athena
  labels:
    postgres.kratos/access: "true"
    searxng.kratos/access: "true"
    llm.kratos/access: "true"
    gpu.kratos/access: "true" # mcp-cluster-read (status) and mcp-cluster-act (acquire, release) only, see egress
    monitoring.kratos/access: "true" # mcp-cluster-read's metrics queries
    qdrant.kratos/access: "true" # memory only, see egress
---
# ---------- core ----------
apiVersion: apps/v1
kind: Deployment
metadata: { name: core, namespace: athena }
spec:
  replicas: 1
  strategy: { type: Recreate } # one scheduler
  selector: { matchLabels: { app: core } }
  template:
    metadata:
      labels: { app: core }
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532 }
      containers:
        - name: core
          image: kratos:5000/athena-core@sha256:c348de3ff1b8ba315da4620fb7a18cecea4337c57cbe627deb6ba30e43302fc0 # 0.6.1
          env:
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: athena, key: DATABASE_URL } } }
            - { name: LLM_URL, value: "http://llm.llm/v1" }
            - { name: LLM_MODEL, value: inkling-2-mini }
            - name: TOOL_SERVERS
              value: web=http://mcp-web/mcp,sources=http://mcp-sources/mcp,everyday=http://mcp-everyday/mcp,notes=http://mcp-notes/mcp,memory=http://memory/mcp,notify=http://notify/mcp,files=http://files/mcp,cluster=http://mcp-cluster-read/mcp,cluster_act=http://mcp-cluster-act/mcp
            - { name: TOOL_TOKENS, valueFrom: { secretKeyRef: { name: athena, key: TOOL_TOKENS } } }
            - { name: MEMORY_URL, value: "http://memory" }
            - { name: MEMORY_TOKEN, valueFrom: { secretKeyRef: { name: athena, key: TOKEN_MEMORY } } }
            - { name: FILES_URL, value: "http://files" }
            - { name: FILES_TOKEN, valueFrom: { secretKeyRef: { name: athena, key: TOKEN_FILES } } }
            - { name: VISION_MODELS, value: "inkling-2-mini,qwen3.6-35b" } # the models started with --mmproj (platform/llm/models)
            - { name: TTS_URL, value: "http://speech/v1" }
            - { name: TTS_TOKEN, valueFrom: { secretKeyRef: { name: athena, key: TOKEN_SPEECH } } }
            - { name: POSE_URL, value: "http://pose" }
            - { name: POSE_TOKEN, valueFrom: { secretKeyRef: { name: athena, key: TOKEN_POSE } } }
            - { name: NOTIFY_URL, value: "http://notify" }
            - { name: NOTIFY_TOKEN, valueFrom: { secretKeyRef: { name: athena, key: TOKEN_NOTIFY } } }
            - { name: REMINDERS_URL, value: "http://mcp-notes" }
            - { name: REMINDERS_TOKEN, valueFrom: { secretKeyRef: { name: athena, key: TOKEN_NOTES } } }
            - { name: POLICY_FILE, value: /etc/athena/policy.yaml }
            - { name: TIME_ZONE, value: Europe/Oslo }
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /ready, port: 8080 } }
          livenessProbe: { httpGet: { path: /health, port: 8080 }, periodSeconds: 30 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: policy, mountPath: /etc/athena, readOnly: true }
      volumes:
        - name: policy
          configMap: { name: athena-policy, items: [{ key: policy.yaml, path: policy.yaml }] }
---
# ---------- ui ----------
apiVersion: apps/v1
kind: Deployment
metadata: { name: ui, namespace: athena }
spec:
  replicas: 1
  selector: { matchLabels: { app: ui } }
  template:
    metadata:
      labels: { app: ui }
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 101, runAsGroup: 101 }
      containers:
        - name: ui
          image: kratos:5000/athena-ui@sha256:1a69a594d0cae1b7ed86bd9512a1a639c91bf9fcd35cca2c4371d4a5490d51f3 # 0.6.1
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /health, port: 8080 } }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
