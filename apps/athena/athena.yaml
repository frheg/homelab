      containers:
        - name: mcp-cluster-act
          image: kratos:5000/athena-mcp-cluster-act@sha256:fedce0f9b4a7e7b5ee52699a8721bd975feeb93ca3e46a046fbe90f28bef12e8 # 0.2.0
          env:
            - { name: ACTIONS_FILE, value: /etc/athena/cluster-actions.yaml }
            - { name: GPUCTL_URL, value: "http://gpuctl.gpu-system" }
