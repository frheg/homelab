# The two GPU experiments left from the old HomeLab: Strata and Stable Diffusion.
# Both are GPU consumers behind a gpuproxy: gpuctl decides when they run, e.g.
#   gpuctl acquire strata
# The old API and Wikipedia ingest were removed; Athena (apps/athena) replaces them.
apiVersion: v1
kind: Namespace
metadata:
  name: homelab
  labels:
    gpu.kratos/access: "true" # the gpuproxies call the arbiter
---
# GPU experiment (~13 GB VRAM). A GPU consumer: gpuctl decides when it runs.
#   gpuctl acquire stable-diffusion
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stable-diffusion
  namespace: homelab
  labels: { gpu.kratos/consumer: stable-diffusion }
spec:
  strategy: { type: Recreate }
  selector: { matchLabels: { app: stable-diffusion } }
  template:
    metadata:
      labels: { app: stable-diffusion, gpu.kratos/consumer: stable-diffusion }
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: sd
          image: kratos:5000/homelab/stable-diffusion@sha256:a24161722a69551b210b7d5650bd10127bfe28468560b041d175a9fe5c761195 # 2026-08-11
          command: ["/sd-server"]
          args:
            - --diffusion-model
            - /models/minimax_h3_fl2va_pruned-UD-Q2_K_XL.gguf
            - --llm
            - /models/qwen3vl_32b_minimax_h3-Q2_K_M.gguf
            - --vae
            - /models/minimax_h3_video_vae_fp16.safetensors
            - --audio-vae
            - /models/minimax_h3_audio_vae_fp32.safetensors
            - --backend
            - te=cpu
            - --diffusion-fa
            # required, or sd-server scans /proc and returns 500 (leejet/stable-diffusion.cpp#1599)
            - --lora-model-dir
            - /models/lora
            - --hires-upscalers-dir
            - /models/upscalers
            - --listen-ip
            - 0.0.0.0
            - --listen-port
            - "1234"
          ports: [{ containerPort: 1234 }]
          readinessProbe:
            tcpSocket: { port: 1234 }
            periodSeconds: 15
          resources:
            requests: { cpu: "1", memory: 4Gi }
            limits: { memory: 24Gi, nvidia.com/gpu-0: "1" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: models, mountPath: /models }
            - { name: outputs, mountPath: /outputs }
      volumes:
        - name: models
          hostPath: { path: /srv/stable-diffusion, type: Directory }
        - name: outputs
          hostPath: { path: /srv/stable-diffusion/outputs, type: DirectoryOrCreate }
---
apiVersion: v1
kind: Service
metadata:
  name: stable-diffusion-backend
  namespace: homelab
spec:
  selector: { app: stable-diffusion }
  ports: [{ port: 1234, targetPort: 1234 }]
---
# GPU experiment: Qwen3.8-Flash-Next with GPU/RAM/SSD-tiered MoE offload. A GPU consumer.
# Needs unlimited memlock (set on k3s) and runs as root, as upstream's image expects.
#   gpuctl acquire strata
apiVersion: apps/v1
kind: Deployment
metadata:
  name: strata
  namespace: homelab
  labels: { gpu.kratos/consumer: strata }
  annotations:
    # the engine loads tens of GB at start, far beyond the 120 s default
    gpu.kratos/start-timeout: 25m
spec:
  strategy: { type: Recreate }
  selector: { matchLabels: { app: strata } }
  template:
    metadata:
      labels: { app: strata, gpu.kratos/consumer: strata }
    spec:
      enableServiceLinks: false
      # the engine releases page-locked RAM on SIGTERM and needs time to do it
      terminationGracePeriodSeconds: 60
      containers:
        - name: strata
          image: kratos:5000/homelab/strata@sha256:c0006e094f65a9678bd6654e7e6fccdf3a3462f692a739d9cc117f6b7563077b # 2026-10-09
          env:
            - { name: FAMILY, value: coder }
            - { name: MODEL, value: IQ1_M }
            - { name: CONTEXT, value: "65536" }
            - { name: VISION, value: "no" }
            - { name: HOST, value: 0.0.0.0 }
            - { name: PORT, value: "8080" }
            - name: API_KEY
              valueFrom: { secretKeyRef: { name: homelab, key: STRATA_API_KEY } }
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 15
          startupProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 15
            failureThreshold: 120
          resources:
            requests: { cpu: "1", memory: 8Gi }
            limits: { memory: 22Gi, nvidia.com/gpu-0: "1" } # below the pod total (~26Gi): a runaway kills only strata
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL], add: [IPC_LOCK] }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          hostPath: { path: /srv/strata, type: Directory }
---
apiVersion: v1
kind: Service
metadata:
  name: strata-backend
  namespace: homelab
spec:
  selector: { app: strata }
  ports: [{ port: 8080, targetPort: 8080 }]
---
# Front door of the strata GPU consumer: asks gpuctl for the GPU, then forwards. Clients keep
# calling the Service "strata", which now points here, and the real one is "strata-backend".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpuproxy-strata
  labels: { gpu.kratos/proxy: strata }
  namespace: homelab
spec:
  selector: { matchLabels: { app: gpuproxy-strata } }
  template:
    metadata:
      labels: { app: gpuproxy-strata }
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: gpuproxy
          image: kratos:5000/gpuproxy@sha256:1c555c77bf2cc81539ee732534012571e6a30da726b323ec62cc9a8f26a8a83e
          args: ["-consumer", "strata", "-backend", "http://strata-backend:8080", "-gpuctl", "http://gpuctl.gpu-system"]
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /_gpuproxy/healthz, port: 8080 }
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: strata
  namespace: homelab
spec:
  selector: { app: gpuproxy-strata }
  ports: [{ port: 8080, targetPort: 8080 }]
---
# Front door of the stable-diffusion GPU consumer: asks gpuctl for the GPU, then forwards. Clients keep
# calling the Service "stable-diffusion", which now points here, and the real one is "stable-diffusion-backend".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpuproxy-stable-diffusion
  labels: { gpu.kratos/proxy: stable-diffusion }
  namespace: homelab
spec:
  selector: { matchLabels: { app: gpuproxy-stable-diffusion } }
  template:
    metadata:
      labels: { app: gpuproxy-stable-diffusion }
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: gpuproxy
          image: kratos:5000/gpuproxy@sha256:1c555c77bf2cc81539ee732534012571e6a30da726b323ec62cc9a8f26a8a83e
          args: ["-consumer", "stable-diffusion", "-backend", "http://stable-diffusion-backend:1234", "-gpuctl", "http://gpuctl.gpu-system"]
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /_gpuproxy/healthz, port: 8080 }
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: stable-diffusion
  namespace: homelab
spec:
  selector: { app: gpuproxy-stable-diffusion }
  ports: [{ port: 1234, targetPort: 8080 }]
